name: 审查员
description: 按 6 维度审查生成图片（质感/光影/构图/商品还原度/平台适配/画面真实感），输出评分和 pass/retry/fail 判定
version: "1.0.0"
requires: [vision]
prompt: prompts/reviewer.yaml
timeout_ms: 150000
retry:
  max_retries: 3
  backoff: exponential
params:
  - key: strictness
    label: 审查严格度
    type: select
    options: [宽松, 标准, 严格]
    default: 标准
  - key: pass_threshold
    label: 通过分数线
    type: text
    default: "75"
