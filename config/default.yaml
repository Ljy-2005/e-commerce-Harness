# E-Commerce Harness 默认配置
# 所有值均可通过环境变量覆盖（前缀 ECOMM_）

app:
  name: "ecommerce-harness"
  version: "0.1.0"
  log_level: "INFO"
  cors_origins: ["http://localhost:5173", "http://localhost:3000"]   # CORS 白名单（ECOMM_CORS_ORIGINS 可覆盖）

chat:
  max_turns: 15             # 最大群聊轮次
  session_ttl_hours: 24     # 会话过期时间
  # 审查/合规**连续**未通过 N 次即自动停止会话（0 = 关闭）。
  # 真实会话里协调者会因合规不过而反复重新生成图片（每轮约 ¥1），
  # 而预算只告警不拦截、max_turns 又太远 —— 这条是明确的止损线。
  # 计数在任一通过时清零；人工 approve/retry 后也清零。
  max_consecutive_review_failures: 2
  # 商品身份未确认时暂停等用户确认（true = 暂停）。
  # 用户反馈："产品分析员根本没有识别到我喂的图是什么品牌，商品名是什么都没强调或者提醒"
  # —— 身份卡是全链路的事实基准，没确认就让模型出图 = 让它编造包装文字（实测把
  # DEFOEBUENA® 编成了 NUTRIVA®）。识别成功时**不打扰**，只有识别失败/低置信度才暂停。
  # 关掉后仍会醒目提醒，但不再拦流程。
  require_identity_confirm: true
  # 出图前的提示词把关（用户 2026-09-18 指定）：先跑**零成本体检**（缺槽位/身份词/包装版式
  # 复述/设计语言缺失/反模式/违禁词），再跑「提示词审核优化员」按大众商品图审美逐张打分，
  # **低于阈值的槽位直接给改写稿**（改写稿必须再过一遍体检才落地）。
  # 用户原话："让生成图提示词更接近大众的商品图审美，免得跑出一些符合基本要求但是图片审美
  # 完全不合格的图片。"
  require_prompt_review: true
  # 审美阈值：低于它的槽位才改写（越高越爱改，85 = 只在明显平淡/廉价时动手）
  prompt_aesthetic_threshold: 85
  # 体检仍有硬伤时打回提示词生成员重写的轮数（0 = 不打回）
  prompt_review_max_rounds: 1
  # 提示词仍不达标时是否暂停等人工确认（默认关：不制造摩擦，只在群聊醒目提示）
  require_prompt_confirm: false
  # 风格档案库 / 用户「风格词库」（用户 2026-09-18 指定，见 config/style_library.yaml）
  # 逐槽位注入设计档案（背景/构图/光影/材质/留白），让"大众商品图审美"可复核、可校准；
  # 用户自己挑的图经「风格档案员」转成文字判词后作为审核打分基准（锚点）。
  # **档案与锚点都不进最终提示词**（最终仍是六段式），只给写提示词/审提示词的角色看。
  style_library_enabled: true
  # **整套最多用几套风格**（0 = 不注入；上限 4）
  #   1（默认）= 一轮会话只用你在「🎨 风格词库」里启用的那一套风格词
  #              （一套 = 背景/构图/光影/材质/颜色分工等**一组字段**，一起用才构成这套风格）；
  #              参考套图没覆盖的槽位只按平台槽位契约写，不再塞内置原型进去
  #              （用户 2026-09-20 实测：每张图被两套互相矛盾的档案同时指挥）
  #   2–4      = 允许内置原型补"参考套图没覆盖的槽位"（显式叠加，风格会混）
  style_library_max: 1

harness:
  retry:
    max_retries: 3
    base_delay_ms: 1000
    max_delay_ms: 30000
    backoff_multiplier: 2.0
    jitter: true

  circuit_breaker:
    failure_threshold: 5
    recovery_timeout_ms: 30000
    half_open_max_requests: 3

  # 注意：**每个 Agent 的实际预算在 config/agents/*.yaml 的 timeout_ms**（A34 起生效，
  # 由注册表写回 Agent 实例）。这里只是参考区间：实测单次视觉调用 28s、推理调用 75s、
  # 方舟 2048×2048 出图 30s/张 —— 旧值（vision 30s / text 15s / image 60s）会频繁误杀。
  timeout:
    default_ms: 150000
    vision_ms: 150000
    text_ms: 150000
    image_ms: 420000

# Agent 记忆库（A36）：历史最佳提示词只作风格/构图参考
memory:
  inject_prompt_reference: true   # 是否把历史最佳提示词注入提示词生成任务
  max_ref_chars: 120              # 参考片段长度上限（越长越容易被整段照抄）

cost:
  budget_usd: 10.0
  warn_threshold: 0.8

image_source:
  max_file_size_mb: 20
  allowed_formats: ["image/jpeg", "image/png", "image/webp"]
  min_resolution: [200, 200]
  max_resolution: [8000, 8000]
