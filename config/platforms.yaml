    aspect: "3:4"
    export_size: "1242x1656"
    min_side: 720
    max_images: 9
    bg: ""
    background_policy: design_allowed
    text_policy: composite
    forbidden: [水印, 平台 logo, 二维码]
    style: |
      生活方式种草图：真实生活场景（原木桌面/布纹/窗边/居家），温暖自然光、柔和暖调、
      浅景深与氛围感，构图自然不做作，竖版 3:4。
      保留真实使用痕迹的亲切感，避免影楼棚拍感与强促销感。
    detail_style: |
      笔记图文版式：柔光生活底（布纹/原木/浅色墙面），留白区用色块或浅色区域承载，
      主体完整可见，克制不做作。
    art_style: 柔光生活：暖调、布纹或原木质感、浅景深、氛围克制
    slots: [note_cover, note_scene, note_detail]

