    detail_style: |
      明亮版式：大面积留白 + 一条活泼色带，主体完整可见，色彩明快但不刺眼。
    art_style: 明亮年轻：高明度、色彩活泼不脏、构图有动势
    slots: [main_white, main_selling_point, main_scene]
    detail_slots: [main_benefits, main_ingredients, main_spec]
