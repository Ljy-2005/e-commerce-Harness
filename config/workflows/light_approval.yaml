# 轻量审核通知 — M4 演示：人工审批 SLA 超时自动通过 + 出站 Webhook 通知
name: 轻量审核通知
version: "1.0.0"
description: 标准生成流水线 + 人工审批（SLA 超时自动通过）+ 结果 Webhook 通知（M4 演示）
category: 智能协作
icon: "📨"
inputs:
  - key: product_images
    label: 商品图片
    type: images
    required: true
  - key: platform
    label: 目标平台
    type: select
    options: [taobao, xiaohongshu, jd]
    default: taobao
  - key: notify_url
    label: 通知回调 URL（可选）
    type: text
    required: false
nodes:
  validate:
    type: tool
    tool: validate_image
    inputs:
      images: $inputs.product_images
  analyze:
    type: agent
    agent: 商品分析员
    task: 分析商品图片
  prompt:
    type: agent
    agent: 提示词生成员
    task: 基于分析生成提示词
  generate:
    type: agent
    agent: 生图员
    task: 使用提示词生成商品图
  review:
    type: agent
    agent: 审查员
    task: 审查图片质量
  human_approval:
    type: human
    prompt: 请人工确认图片质量（SLA 超时将自动通过）
    sla_minutes: 60
    on_sla_timeout: auto_approve
    routes:
      approve: notify
      retry: prompt
      reject: failed_end
  notify:
    type: tool
    tool: webhook_notify
    inputs:
      url: $inputs.notify_url
      event: job_completed
      payload:
        platform: $inputs.platform
        review_score: $steps.review.outputs.overall_score
  success_end:
    type: end
    status: completed
  failed_end:
    type: end
    status: failed
