# 风格档案库（内置）—— 只描述"怎么设计"，不含任何品牌/成分/认证/色值文字
#
# 为什么有这个文件
#   用户 2026-09-18："我加这个的初衷是为了让生成图提示词更接近大众的商品图审美，
#   免得跑出一些符合基本要求但是图片审美完全不合格的图片。"
#
#   与"商品图审美"有关的可复用决策（版式 / 光位 / 材质 / 留白节奏）此前**只存在于
#   提示词生成员的自由发挥**里 —— 同一个商品两次跑出来的画面完全不同，审美也就无从校准。
#   这里把设计惯例沉淀成档案：按「品类 + 平台 + 槽位 + 背景策略」检索，**逐槽位**注入
#   「提示词生成员」与「提示词审核优化员」（审核优化员按它逐条对照，用户锚点优先于它）。
#
# 安全边界（**不要在这份文件里写商品事实**）
#   1) 本文件是**文字**档案。图片一律不进生图链路：用户导入的照片只经「风格档案员」
#      转成文字判词（落在 data/style_library/），**不作生图参考图**。
#   2) 不得出现：品牌名 / 品名 / 规格 / 认证 / 成分 / 功效 / 产地 / 价格，以及商标符号（®™©）。
#   3) 不得出现具体色值（#RRGGBB）—— 色板一律来自**本商品包装**
#      （product_identity.brand_palette）。档案只描述"色板角色怎么用"：
#      主色 → 色带/标题条、辅色 → 点缀、底色 → 背景。
#   4) 材质一律写成条件句（"若包装本身有烫金…"），不许凭空给商品加不存在的工艺。
#
#   加载时 src/harness/style_library.py 会逐条校验第 2/3 条：命中即**丢弃该条并记账**
#   （不静默）。查看方式：python scripts/style_preview.py
#
# 字段说明
#   id / name / summary            标识与人读说明
#   style_words                    一段人读的风格词条（给模型作**写作参考**；
#                                  **不整段进最终提示词**，避免 10 张一个模子）
#   applies_to.kinds               photo（模型直接出成品）｜info（出无字底图 + 本地排版文字层）
#   applies_to.slots / not_slots   只给这些槽位 / 排除这些槽位（空 = 不限）
#   applies_to.categories          品类关键词（对 analysis 的 品类/子品类/剂型/特征 做包含匹配）；
#                                  空 = **通用兜底**（任何品类都命中）
#   applies_to.platforms           平台 slug（空 = 全平台）
#   applies_to.requires_policy     只在这些背景策略下适用（white_required / white_preferred /
#                                  design_allowed；空 = 不限）
#   background / composition / lighting / materials / elements / palette_roles / whitespace / forbid
#                                  设计要点。检索命中后逐槽位注入；
#                                  **槽位契约（must/forbid/keep_clear）永远优先于档案**
#
# 套图结构（**内置档案一律不写这两个字段**）
#   shot_flow                      整套的叙事顺序（一句话，≤60 字）
#   shot_roles                     逐张角色：[{number, slot, treatment}]
#                                  · number  = 第几张（1 起，与照片顺序一致）
#                                  · slot    = config/platforms.yaml 的槽位 id（选不到留空）
#                                  · treatment = 这一张与共同美术不同的地方
#   ⚠️ 这两个字段**只由「风格档案员」分析用户导入的照片后写入**
#      `data/style_library/entries.json`（用户词条）。内置档案是"逐槽位怎么做"的通用原型，
#      不描述某一套图的顺序 —— 不要在这里写示例值（会被误当成内置数据，也会被模型照抄）。
#
# 排序规则（确定性，见 style_library.select_by_slot）：
#   **一轮会话只用一套风格词**：词库里启用的那**一套**贯穿整套图；参考套图没覆盖的槽位只按平台
#   槽位契约写（严格模式）；`max_entries ≥ 2` 时才允许内置原型去补那些槽位。
#
# 「一套风格词」= 词库里的一条记录 = 一组理念一致的设计字段：
#   style_words（总述）+ background / composition / lighting / materials / elements /
#   palette_roles / whitespace / forbid / keep_clear_hint（做法）+ shot_flow / shot_roles（套图结构）。
#   这些字段**一起用**才构成一套；不是"一个词"。
#   用户 2026-09-20 更正："p3 应该是一套风格词，而不是一个风格词"。

version: 1

# 默认值（设置页「会话策略」的 chat.style_library_enabled / style_library_max 可覆盖；
# 两者都留空时以这里为准，代码再兜底 enabled=true / max_entries=1）
#
# max_entries 的语义是「**整套最多用几套风格**」：
#   1（默认）= 只用你在「风格词库」里启用的那**一套**风格词（一轮会话一套风格词）；
#              参考套图没有覆盖的槽位只按平台槽位契约写，**不会**再塞一套内置原型进去
#              （用户 2026-09-20：实测每张图被两套互相矛盾的档案同时指挥）；
#   2–4      = 允许内置原型去补"参考套图没覆盖的槽位"（显式选择的叠加，风格会混）。
defaults:
  enabled: true
  max_entries: 1
  max_anchors: 2

entries:

  # ── 白底主体（所有平台的第 1 张几乎都是它）──
  - id: clean_hero_white
    name: 净白硬照
    summary: 白底主体的标准做法：85–92% 占比 + 短椭圆投影 + 细窄镜面高光，不靠装饰取胜
    style_words: >-
      纯白无缝底，主体居中或略偏左、正面平视或 8° 微俯，占画面 85–92%，四周留窄白边；
      顶部柔光箱为主光、右前 45° 白卡补光、背后一条窄轮廓光沿盒体勾边；
      投影短椭圆约 12% 透明度；纸盒哑光纤维可见，工艺部位只出现细窄镜面高光。
    applies_to:
      kinds: [photo]
      slots: [main_white]
      categories: []
      platforms: []
      requires_policy: []
    background: 纯白无缝（平台要求纯白时必须严格纯白；不要求时也只允许极浅的品牌底色，明度 ≥96%，不得有可辨纹理）
    composition: 主体居中或略偏左（视觉重心略高于几何中心），正面平视或 8° 微俯，占画面 85–92%，四周留窄白边 ≥6%
    lighting: 顶部 120cm 柔光箱主光 + 右前 45° 白卡补光 + 背后一条窄轮廓光沿盒体右侧勾边；投影短椭圆、约 12% 透明度；高光克制不爆、不出现密集光斑
    materials: 纸盒哑光纤维可见；若包装本身有烫金或镜面工艺，让该区域出现一条细窄的镜面高光；若为瓶罐，让瓶身纵向出现一条连续窄高光带
    elements: []
    palette_roles:
      primary: 仅用于主体自身（包装颜色），不加色块
      secondary: 不用
      background: 纯白或极浅品牌底
    whitespace: 主体 85–92%，四周留窄白边，画面无道具、无装饰、无文字
    forbid: [撞色, 彩虹渐变, 贴纸描边, 密集光斑, 灰底或可见纹理背景]

  # ── 白底/浅底平台的其他照片槽位（白底为通行做法：Amazon / 京东 / 1688）──
  - id: clean_white_studio
    name: 白底棚拍（通用）
    summary: 白底或极浅灰白渐层的棚拍做法，适合白底平台的非首图槽位（场景/细节/规格）
    style_words: >-
      纯白到极浅灰白的竖向渐层（明度差 ≤4%），主体居中或三分线交点、占画面 70–85%；
      双侧柔光对称补光、投影极淡或去投影；材质纹理清晰可辨，画面干净无道具。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: []
      platforms: []
      requires_policy: [white_required, white_preferred]
    background: 纯白或纯白到极浅灰白的竖向渐层（明度差 ≤4%，不得出现第三色）
    composition: 主体居中或置于三分线交点、占画面 70–85%；四周留白均匀，形成规整秩序感
    lighting: 双侧柔光对称补光，明暗差克制；投影极淡（≤8%）或去投影；高光位置对称、不抢视线
    materials: 材质纹理要能看清（哑光纸纹、铝箔细褶、玻璃通透），但不得靠高对比度硬拉锐度
    elements: [细线框（可选，最多 1 处）]
    palette_roles:
      primary: 仅主体自身
      secondary: 不用
      background: 纯白或极浅灰白
    whitespace: 主体 70–85%，留白均匀、四面不贴边
    forbid: [撞色, 彩虹渐变, 暗调脏底, 密集光斑, 道具]

  # ── 设计底平台（淘宝/天猫/拼多多/抖音等）的通用做法 ──
  - id: brand_color_block
    name: 品牌色块留白
    summary: 一块品牌色压住视觉重心 + 大留白，最省事地把"正规品牌感"做出来
    style_words: >-
      品牌浅色底（取包装底色），一条横向品牌色块占画面 25–35% 压住视觉重心，色块边缘平直；
      主体置于三分线交点、占画面 55–70%，留白 ≥30% 且集中在一侧；
      主光偏左上方 45°、右侧弱补光，投影短而干净。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: []
      platforms: []
      requires_policy: [design_allowed, white_preferred]
    background: 品牌浅色底（明度 ≥92%，取自包装底色）；一条横向品牌色块占画面 25–35%，边缘平直、不遮挡主体；可用极浅竖向渐层（明度差 ≤6%）
    composition: 主体置于三分线交点、占画面 55–70%，留白 ≥30% 且集中在色块的另一侧；色块与主体的呼应方向一致
    lighting: 主光偏左上方 45°、右侧弱补光勾出主体暗部边缘；投影短而干净（≤15% 主体高度）或去投影；色块上不出现高光斑
    materials: 哑光纸盒纹理与色块形成材质对比；色块与主体之间留一条细窄的高光分隔，避免主体"贴"在色块上
    elements: [横向品牌色块, 细线框]
    palette_roles:
      primary: 横向色块 / 标题条
      secondary: 点缀（≤1 处小面积）
      background: 品牌浅色底
    whitespace: 主体 55–70%、留白 ≥30%；色块只压边缘，不侵入留白区
    forbid: [撞色, 彩虹渐变, 贴纸描边, 暗调脏底, HDR 味]

  # ── 美妆 / 护肤 / 香氛 ──
  - id: soft_studio_gradient
    name: 柔光渐层
    summary: 极浅径向渐层 + 边缘细高光，美妆护肤最通用的"贵一点"做法
    style_words: >-
      极浅径向渐层（中心亮、四角略暗，明度差 ≤6%），可叠一层几乎不可见的布纹或纸纹；
      主体居中偏左、占 60–70%，右侧留竖向空白；大面积柔光 + 环形补光，投影极淡；
      玻璃通透、瓶身纵向一条连续细窄高光。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: [美妆, 护肤, 化妆品, 彩妆, 香氛, 香水, 精华, 面膜, 洗护, 个护, 美容]
      platforms: []
      requires_policy: [design_allowed]
    background: 极浅径向渐层（中心亮、四角略暗，明度差 ≤6%），可叠一层透明度 ≤3% 的布纹或纸纹微质感
    composition: 主体居中偏左、正面或 3/4 视角、占画面 60–70%；右侧留竖向空白作呼吸，不与主体元素重叠
    lighting: 大面积柔光做主光 + 环形补光消硬阴影；投影极淡（≤8%）或去投影；瓶身边缘形成一条连续细窄亮线，高光不爆
    materials: 玻璃通透、金属盖出现细窄镜面高光、磨砂塑料呈柔和高光；若包装本身有渐变工艺，让它在光下自然过渡
    elements: [细线框（可选）]
    palette_roles:
      primary: 主体与色带（若有）
      secondary: 背景渐层的暗角倾向
      background: 极浅渐层底
    whitespace: 主体 60–70%，一侧留白 ≥30%
    forbid: [撞色, 彩虹渐变, 密集光斑, 暗调脏底, 过度锐化]

  # ── 保健 / 食品 / 滋补 ──
  - id: herbal_natural
    name: 植物语境
    summary: 哑光浅米底 + 一件植物道具，暖白侧光；道具只作语境，不遮挡、不抢主体
    style_words: >-
      哑光浅米或浅卡其底（取自包装底色），可有一处柔和光影斑；
      主体居中偏右、占 55–65%，左侧一件植物或谷物道具占 ≤15% 且不与主体重叠；
      侧后方暖白光 45°，投影自然略长；哑光纸盒与干燥植物质感。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: [保健, 营养, 滋补, 食品, 茶, 谷物, 口服液, 胶囊, 维生素, 膳食]
      platforms: []
      requires_policy: [design_allowed]
    background: 哑光浅米或浅卡其底（取自包装底色，明度 ≥88%）；可有一处柔和的光影斑，不得形成可辨图案
    composition: 主体居中偏右、占画面 55–65%；左侧放置**一件**与用途相关的植物或谷物道具（枝叶 / 谷物 / 茶枝），占画面 ≤15%，不与主体重叠、不遮挡包装正面
    lighting: 侧后方暖白光 45° 为主光，主体受光面柔和；投影自然、略长（≤25% 主体高度）；道具投影与主体投影方向一致
    materials: 哑光纸盒或牛皮纸质感、干燥植物纹理；若包装本身有工艺部位，让它出现细窄高光
    elements: [一件植物或谷物道具, 浅色台面]
    palette_roles:
      primary: 主体与色带（若有）
      secondary: 道具的自然色（低饱和）
      background: 哑光浅米底
    whitespace: 主体 55–65%，留白 ≥30%
    forbid: [密集光斑, 撞色, 医疗器材或化验单类道具, 器官示意图]

  # ── 保健 / 器械 / 口腔（严谨感）──
  - id: clinical_precision
    name: 临床严谨
    summary: 冷白渐层 + 细线框网格，对称布光，秩序感与专业感优先
    style_words: >-
      冷白到极浅灰蓝的竖向渐层，一角叠一组几乎不可见的细线框或网格；
      主体居中、正面平视、占 70–80%，上下留等宽留白；
      双侧对称补光 + 顶部一条硬光勾出上沿；投影对称短椭圆；标签边缘锐利。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: [保健, 营养, 维生素, 器械, 医疗, 口腔, 护理, 防护, 检测]
      platforms: []
      requires_policy: [design_allowed]
    background: 冷白到极浅灰蓝的竖向渐层（明度差 ≤6%）；左下或右上叠一组细线框或网格，透明度 ≤6%，不与主体交叠
    composition: 主体居中、正面平视、占画面 70–80%；上下留等宽留白形成秩序感，主体边缘与线框对齐
    lighting: 双侧对称补光 + 顶部一条窄硬光勾出盒体上沿；投影为对称短椭圆、透明度 ≤12%；高光细而均匀
    materials: 铝箔袋细密褶皱高光、瓶身通透、标签纸边缘锐利；避免柔化到失去质感
    elements: [细线框, 网格（透明度 ≤6%）]
    palette_roles:
      primary: 线框与标题条（若有）
      secondary: 网格
      background: 冷白到浅灰蓝渐层
    whitespace: 主体 70–80%，上下等宽留白 ≥12%
    forbid: [暖调脏黄, 撞色, 器官示意图, 密集光斑]

  # ── 3C / 数码 / 家电 ──
  - id: tech_dark_metal
    name: 深色科技质感
    summary: 深灰渐层 + 镜面台面 + 单侧轮廓光；只在允许设计底的平台用
    style_words: >-
      深灰到黑的中性渐层（明度 12–22%），底部一块镜面反射台面；
      主体 3/4 视角略偏右、占 60–70%；单侧冷调轮廓光勾边 + 顶部柔光做主光；
      金属细拉丝、玻璃镜面、硅胶哑光，高光细而亮。
    applies_to:
      kinds: [photo]
      not_slots: [main_white]
      categories: [3C, 数码, 电子, 手机, 电脑, 耳机, 音箱, 智能, 家电, 配件, 键鼠, 摄像, 充电, 显示]
      platforms: []
      requires_policy: [design_allowed]
    background: 深灰到黑的中性渐层（明度 12–22%，不得偏色）；底部一块镜面反射台面，反射只占画面 ≤25% 高度
    composition: 主体 3/4 视角、略偏右、占画面 60–70%；左上方留出一段暗部空间作为呼吸，主体与反射在竖直方向对齐
    lighting: 顶部柔光做主光 + 单侧冷调轮廓光勾出主体边缘；高光细而亮、沿边缘连续；投影短、落在镜面台面上并与主体对齐
    materials: 金属细拉丝纹、玻璃镜面、硅胶或素皮哑光；反射面要能看到但不得出现第二个主体
    elements: [镜面反射台面, 一条斜向光带]
    palette_roles:
      primary: 轮廓光与光带的色相倾向
      secondary: 台面反射
      background: 深灰中性渐层
    whitespace: 主体 60–70%，上方或一侧留暗部呼吸 ≥25%
    forbid: [彩虹渐变, 密集光斑, HDR 味, 过度锐化, 主体倒影与主体抢视线]

  # ── 信息图（卖点/功效/成分/人群/规格/用法/资质/对比）通用底图 ──
  - id: info_bullet_sheet
    name: 信息图版式
    summary: 留白 ≥40% 的干净底图 + 商品完整入画 + 一条品牌色标题条；文字由系统本地排版
    style_words: >-
      纯白或极浅品牌底色，干净明亮；商品实物完整置于一角、占高 50–60%；
      一侧或上方留出 ≥40% 平整留白，留白区内无图案、无道具、无阴影；
      一条品牌色标题条 ≤13% 高度 + 最多 2 条细线分隔；均匀柔光、投影极淡。
    applies_to:
      kinds: [info]
      categories: []
      platforms: []
      requires_policy: []
    background: 纯白（平台要求纯白时必须严格纯白）或极浅品牌底色，干净明亮、明度 ≥92%；不做暗调、不做复杂装饰；除留白区外不得出现图案
    composition: 商品实物完整可见、不裁切、置于一角（右下或左下）、占画面高度 50–60%；其余为平整留白区，留白区与商品区不重叠
    lighting: 均匀柔光（无强方向性）；投影极淡（≤8%）或不投影，且**不得在留白区里投出可见阴影**；高光克制，避免在留白区形成亮斑
    materials: 商品材质清晰可辨（哑光纸纹、铝箔、胶囊通透），留白区完全平整、无纹理干扰
    elements: [品牌色标题条（≤13% 高度）, 细线分隔（≤2 条）]
    palette_roles:
      primary: 标题条与细线
      secondary: 条目符号底纹（若有）
      background: 纯白或极浅品牌底
    whitespace: 留白 ≥40% 且集中在指定区域（供系统本地排版文字层），留白区内不得有图案、道具、光斑或主体穿过
    forbid: [留白区内的图案或纹理, 指向性箭头, 图标标签, 画面内的文字字母数字]
    keep_clear_hint: 留白区位置以该槽位的「留白区」契约字段为准（例如"左侧与上方 ≥45%"）

