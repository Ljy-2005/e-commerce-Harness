name: Real API Suite

on:
  workflow_dispatch:
    inputs:
      deepseek_key:
        description: DeepSeek API Key（留空则用仓库 secrets）
        required: false
      seedream_key:
        description: Seedream API Key（留空则用仓库 secrets；无 Key 的套件自动 skip）
        required: false

jobs:
  real:
    name: Real API tests (DeepSeek / Seedream)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Real API suite（手动触发，产生真实费用）
        env:
          DEEPSEEK_API_KEY: ${{ inputs.deepseek_key || secrets.DEEPSEEK_API_KEY }}
          SEEDREAM_API_KEY: ${{ inputs.seedream_key || secrets.SEEDREAM_API_KEY }}
        run: python -m pytest -m real -v
