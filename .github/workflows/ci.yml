name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint (E/F/I/W)
        run: python -m ruff check src tests

      - name: Full test suite (Mock Mode + slow, no real)
        # addopts 默认排除 real/slow；此处显式含 slow（负载套件），仅排除 real
        run: python -m pytest -m "not real" -q

  frontend:
    name: Frontend (tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend unit/component tests (Vitest)
        run: npm test
        working-directory: frontend

      - name: Production build
        run: npm run build
        working-directory: frontend

      # P6（test-plan L9）：依赖安全门禁——高危及以上漏洞即红
      # （官方 registry：npmmirror 无 advisory 端点，见 progress.md 前端依赖核查）
      - name: Dependency audit (high+)
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: frontend

  docker:
    name: Docker build (nginx multi-stage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build nginx image
        run: docker build -f deploy/nginx.Dockerfile -t ecommerce-harness:ci .

  e2e:
    name: E2E smoke (Mock, 7 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend deps
        run: pip install -e ".[dev]"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: E2E smoke（自启确定性 Mock 服务，跑完自停）
        run: python scripts/e2e_smoke.py

  # 敏感内容防护（第 4 层）：本地钩子被 --no-verify 绕过时，由 CI 兜底
  secrets:
    name: Secrets guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gitleaks 需要完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 项目自带的规则扫描（文件名 + 高置信度内容特征）
      - name: Scan tracked files (scripts/check_secrets.py)
        run: python scripts/check_secrets.py --ci

      # 钩子安装器自检：防止 setup_hooks.py 悄悄失效
      - name: Verify hook installer works
        run: |
          python scripts/setup_hooks.py
          python scripts/setup_hooks.py --check

      # gitleaks 补位：熵检测覆盖未知服务商的密钥形态
      - name: gitleaks (full history)
        run: |
          GITLEAKS_VERSION=8.24.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1 --verbose
