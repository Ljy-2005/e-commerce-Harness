[project]
name = "ecommerce-harness"
version = "0.2.0"
description = "群聊式多智能体电商商品图生成系统"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "httpx>=0.28",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "typer>=0.15",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "openai>=1.70",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# P4（test-plan）：默认套件只跑确定性 Mock——real（真实 API，花钱/需 Key）与
# slow（负载压力）显式排除；`pytest -m real` / `pytest -m slow` 手动触发，
# `pytest -m "not real"` 跑含 slow 的全量（CI 后端 job 用）
addopts = "-m 'not real and not slow'"
markers = [
    "slow: slow integration tests",
    "real: tests that require real API keys",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
