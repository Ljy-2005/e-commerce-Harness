services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ECOMM_MOCK_MODE=false
      - ECOMM_LOG_LEVEL=INFO
    env_file:
      - .env
    volumes:
      - harness_data:/app/data
      - harness_output:/app/output
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          memory: 512M

  nginx:
    # 多阶段构建：Node 构建前端产物 → nginx 直接服务（修复 frontend_dist 空卷问题）
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "80:80"
    environment:
      - API_HOST=api   # 后端服务名（envsubst 渲染代理配置）
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

volumes:
  harness_data:
  harness_output:
